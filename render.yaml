# Render Blueprint for the Creva Solutions contact API (separate backend in ./backend).
# Render Dashboard -> New -> Blueprint -> select this repository. Secret values are entered in the dashboard
# (sync: false) and are never stored in Git.
services:
  - type: web
    name: creva-contact-api
    runtime: node
    rootDir: backend
    # Free works with EMAIL_PROVIDER=resend. (SMTP needs a paid plan: Render Free blocks ports 25/465/587.)
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: https://xtivwelnoccdontbrxft.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: info@crevasolution.in
      - key: MAIL_FROM_NAME
        value: Creva Solutions
      - key: ADMIN_EMAIL
        value: info@crevasolution.in
      - key: ALLOWED_ORIGINS
        value: https://crevasolution.in
