<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Inquiries - Creva Admin</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/blog-admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .iq-count { color: var(--text-muted); font-size: .9rem; align-self: center; }
        .iq-name { font-weight: 600; color: var(--text-main); }
        .iq-table a { color: var(--primary-color); text-decoration: none; }
        .iq-table a:hover { text-decoration: underline; }
        .iq-service { display: inline-block; background: #f3f4f6; padding: 2px 8px; border-radius: 12px; font-size: .75rem; font-weight: 600; text-transform: uppercase; }
        .iq-date { white-space: nowrap; color: var(--text-muted); }
        .iq-detail td { background: #f9fafb; }
        .iq-detail[hidden] { display: none; }
        .iq-message { white-space: pre-wrap; line-height: 1.55; color: #374151; margin: 0; }
        .iq-extra { margin-top: .75rem; font-size: .85rem; color: var(--text-muted); }
        .iq-error { color: var(--danger, #b91c1c); }
        @media (max-width: 768px) {
            .iq-detail td::before { display: none; }
        }
    </style>
</head>

<body class="dashboard-body">
    <!-- Nav -->
    <nav class="dashboard-nav">
        <div class="nav-brand"><a href="dashboard.html" style="text-decoration:none; color:inherit;">Creva Admin</a> /
            Inquiries</div>
        <button id="logout-btn" class="btn-logout">Logout</button>
    </nav>

    <main class="dashboard-content">
        <div class="bl-head">
            <div>
                <h1>Inquiries</h1>
                <p class="bl-sub">Messages submitted through the website “Contact Us” form, newest first.</p>
            </div>
            <button type="button" id="iq-refresh" class="bl-btn bl-btn-primary">Refresh</button>
        </div>

        <div class="dashboard-card bl-card">
            <div class="bl-toolbar">
                <input type="search" id="iq-search" class="form-control" placeholder="Search name, email, mobile or service…" aria-label="Search inquiries">
                <span id="iq-count" class="iq-count" aria-live="polite"></span>
            </div>

            <div class="bl-table-wrap">
                <table class="bl-table iq-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Mobile</th>
                            <th>Service</th>
                            <th>Date</th>
                            <th>Message</th>
                        </tr>
                    </thead>
                    <tbody id="iq-rows">
                        <tr><td colspan="6" class="bl-empty">Loading inquiries…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cms.js"></script>
    <script>
        // Inquiries = rows of public.contact_submissions (written by the website contact form).
        // Read through the signed-in admin session; RLS allows SELECT for authenticated users only.
        (function () {
            const rows = document.getElementById('iq-rows');
            const search = document.getElementById('iq-search');
            const countEl = document.getElementById('iq-count');
            const refreshBtn = document.getElementById('iq-refresh');
            const KNOWN = ['id', 'created_at', 'name', 'email', 'mobile', 'service', 'message'];
            let all = [];

            const esc = (v) => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            const fmtDate = (iso) => {
                const d = new Date(iso);
                return isNaN(d) ? '' : d.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            };
            const label = (k) => k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
            const state = (html, cls) => { rows.innerHTML = `<tr><td colspan="6" class="bl-empty ${cls || ''}">${html}</td></tr>`; };

            function render() {
                const q = search.value.trim().toLowerCase();
                const list = q ? all.filter(m => ['name', 'email', 'mobile', 'service', 'message']
                    .some(k => String(m[k] || '').toLowerCase().includes(q))) : all;
                countEl.textContent = all.length ? (q ? `${list.length} of ${all.length}` : `${all.length}`) + (all.length === 1 ? ' inquiry' : ' inquiries') : '';
                if (!all.length) return state('No inquiries yet. New contact form submissions will appear here.');
                if (!list.length) return state('No inquiries match your search.');

                rows.innerHTML = list.map((m, i) => {
                    const mobileDigits = String(m.mobile || '').replace(/[^\d+]/g, '');
                    // Any other columns the table may have (shown only when present in the data)
                    const extra = Object.keys(m).filter(k => !KNOWN.includes(k) && m[k] != null && m[k] !== '')
                        .map(k => `<div><strong>${esc(label(k))}:</strong> ${esc(typeof m[k] === 'object' ? JSON.stringify(m[k]) : m[k])}</div>`).join('');
                    const hasDetail = (m.message && String(m.message).trim()) || extra;
                    return `
                    <tr>
                        <td data-label="Name"><span class="iq-name">${esc(m.name) || '—'}</span></td>
                        <td data-label="Email">${m.email ? `<a href="mailto:${esc(m.email)}">${esc(m.email)}</a>` : '—'}</td>
                        <td data-label="Mobile">${m.mobile ? `<a href="tel:${esc(mobileDigits)}">${esc(m.mobile)}</a>` : '—'}</td>
                        <td data-label="Service">${m.service ? `<span class="iq-service">${esc(m.service)}</span>` : '—'}</td>
                        <td data-label="Date" class="iq-date">${m.created_at ? `<time datetime="${esc(m.created_at)}">${esc(fmtDate(m.created_at))}</time>` : '—'}</td>
                        <td data-label="Message">${hasDetail ? `<button type="button" class="bl-btn bl-btn-sm" data-toggle="${i}" aria-expanded="false" aria-controls="iq-detail-${i}">View</button>` : '—'}</td>
                    </tr>
                    ${hasDetail ? `<tr class="iq-detail" id="iq-detail-${i}" hidden><td colspan="6">
                        ${m.message ? `<p class="iq-message">${esc(m.message)}</p>` : ''}
                        ${extra ? `<div class="iq-extra">${extra}</div>` : ''}
                    </td></tr>` : ''}`;
                }).join('');
            }

            async function load() {
                refreshBtn.disabled = true;
                refreshBtn.textContent = 'Refreshing…';
                if (!all.length) state('Loading inquiries…');
                try {
                    // Wait for the stored admin session (auth.js redirects to login when there is none)
                    const { data: { session } } = await window.supabaseClient.auth.getSession();
                    if (!session) return state('Please sign in to view inquiries.');
                    all = (await fetchMessages()) || [];
                    render();
                } catch (err) {
                    console.error('Error loading inquiries:', err);
                    all = [];
                    countEl.textContent = '';
                    state(`Could not load inquiries: ${esc(err.message || 'unknown error')}. <button type="button" class="bl-btn bl-btn-sm" id="iq-retry">Try again</button>`, 'iq-error');
                } finally {
                    refreshBtn.disabled = false;
                    refreshBtn.textContent = 'Refresh';
                }
            }

            rows.addEventListener('click', (e) => {
                if (e.target.id === 'iq-retry') return load();
                const btn = e.target.closest('button[data-toggle]');
                if (!btn) return;
                const detail = document.getElementById('iq-detail-' + btn.dataset.toggle);
                const open = detail.hidden;
                detail.hidden = !open;
                btn.setAttribute('aria-expanded', String(open));
                btn.textContent = open ? 'Hide' : 'View';
            });
            search.addEventListener('input', render);
            refreshBtn.addEventListener('click', load);
            document.addEventListener('DOMContentLoaded', load);
        })();
    </script>
</body>

</html>
